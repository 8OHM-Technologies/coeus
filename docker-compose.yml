services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
    container_name: coeus-cloud-sql-proxy
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${INSTANCE_CONNECTION_NAME}"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
    volumes:
      - ~/.config/gcloud:/config:ro
    networks:
      - 8ohm-network
    restart: always

  traefik:
    image: traefik:latest
    container_name: coeus-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "81:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - 8ohm-network

  control_plane:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: coeus-control-plane
    image: coeus_app_image
    depends_on:
      - cloud-sql-proxy
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: cloud-sql-proxy
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@coeus.local
      DJANGO_SUPERUSER_PASSWORD: admin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-plane.rule=Host(`control-plane.localhost`)"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8001"
      - "traefik.docker.network=8ohm-network"
    command: >
      bash -c "python control_plane/manage.py makemigrations &&
                python control_plane/manage.py migrate &&
                python control_plane/manage.py createsuperuser --noinput || true &&
                python control_plane/manage.py runserver 0.0.0.0:8001"

  pipeline_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: coeus-worker
    image: coeus_worker_image
    depends_on:
      - cloud-sql-proxy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: cloud-sql-proxy
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./data:/app/data
      - huggingface_cache:/app/huggingface_cache
    networks:
      - 8ohm-network
    command: tail -f /dev/null

  airflow:
    image: apache/airflow:2.9.1-python3.11
    container_name: coeus-airflow
    user: "${AIRFLOW_UID:-50000}"
    depends_on:
      - cloud-sql-proxy
    entrypoint: >
      /bin/bash -c " airflow db upgrade && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@coeus.local || true && (airflow webserver & airflow scheduler & wait)"
    env_file:
      - .env
    environment:
      AIRFLOW__WEBSERVER__WEB_SERVER_HOST: 0.0.0.0
      AIRFLOW__CORE__LOAD_EXAMPLES: False
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_SQL_ALCHEMY_CONN}
      HOST_DATA_PATH: ${PWD}/data
      COEUS_API_URL: ${COEUS_API_URL}
      PYTHONPATH: /opt/airflow/extraction_workers
    ports:
      - "9001:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airflow.rule=Host(`airflow.localhost`)"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"
      - "traefik.docker.network=8ohm-network"
    volumes:
      - ${PWD}/orchestration/airflow_dags:/opt/airflow/dags
      - ${PWD}/extraction_workers:/opt/airflow/extraction_workers
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - 8ohm-network

volumes:
  huggingface_cache:

networks:
  8ohm-network:
    name: 8ohm-network
    driver: bridge
