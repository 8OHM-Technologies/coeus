  #     context: ./ohmshop
  #     dockerfile: ./apps/backend/Dockerfile
  #   container_name: coeus-ohmshop
  #   depends_on:
  #     - postgres
  #     - redis
  #   command: sh -c "npm run db:migrate --workspace=apps/backend && npm run start --workspace=apps/backend"
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #     REDIS_URL: redis://redis:6379
