{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Infinity Ohm</title>
    <meta name="theme-color" content="#050505">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" />
    <link rel="stylesheet" href="{% static 'landing_page/css/style.css' %}">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; flex-direction: column;">
    <div class="background-visuals">
        <div class="glow-orb orb-1"></div>
        <div class="grid-overlay"></div>
    </div>
    
    <div class="bezel-card-outer" style="max-width: 500px; width: 90%;">
        <div class="bezel-card-inner" style="padding: 40px;">
            <div class="card-icon" style="margin: 0 auto 20px;">
                <i class="ph-light ph-wifi-slash"></i>
            </div>
            <h2 class="card-title" style="margin-bottom: 16px;">You are currently offline</h2>
            <p class="card-desc" style="margin-bottom: 32px;">
                It seems you've lost your connection to the grid. Please check your network and try again.
            </p>
            <button type="button" class="btn btn-primary" onclick="window.location.reload();" style="margin: 0 auto;">
                <span>Retry Connection</span>
                <div class="btn-icon"><i class="ph-light ph-arrows-clockwise"></i></div>
            </button>
        </div>
    </div>
</body>
</html>
