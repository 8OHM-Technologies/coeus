name: PRODUCTION VPS DEPLOYMENT

on:
  push:
    branches: [main]

jobs:
  # 1. Detect which Docker images actually need rebuilding
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      any_image_changed: ${{ steps.filter.outputs.app == 'true' || steps.filter.outputs.playwright_worker == 'true' || steps.filter.outputs.dagster == 'true' || steps.filter.outputs.scraper == 'true' || steps.filter.outputs.extractor == 'true' }}
      app_changed: ${{ steps.filter.outputs.app }}
      playwright_worker_changed: ${{ steps.filter.outputs.playwright_worker }}
      dagster_changed: ${{ steps.filter.outputs.dagster }}
      scraper_changed: ${{ steps.filter.outputs.scraper }}
      extractor_changed: ${{ steps.filter.outputs.extractor }}
      msg_id: ${{ steps.telegram-start.outputs.msg_id }}
    steps:
      - name: Notify on Workflow Start
        id: telegram-start
        run: |
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_TO }}" \
            -d "parse_mode=HTML" \
            -d "text=🧨 STARTED ${{github.workflow}} 🧨 %0A------------------------------------------------------------------------%0A%0A Repo: <a href='${{ github.server_url }}/${{ github.repository }}'>${{ github.repository }}</a>  %0A Run: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>${{ github.run_id }}</a>")
          
          MSG_ID=$(echo "$RESPONSE" | jq '.result.message_id')
          echo "msg_id=$MSG_ID" >> $GITHUB_OUTPUT

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check for per-image file changes
        uses: dorny/paths-filter@f3ceefdc7ef57bc2d8560787d4b6c33e44044cec
        id: filter
        with:
          filters: |
            app:
              - 'Dockerfile.app'
              - 'requirements-app.txt'
              - 'control_plane/**'
              - 'ohmshop/**'
              - 'docker-compose*.yml'
              - '.github/workflows/deploy.yml'
            playwright_worker:
              - 'Dockerfile.playwright_worker'
              - 'requirements-worker.txt'
              - 'dagster/**'
              - 'docker-compose*.yml'
              - '.github/workflows/deploy.yml'
            dagster:
              - 'Dockerfile.dagster'
              - 'dagster/**'
              - 'docker-compose*.yml'
              - '.github/workflows/deploy.yml'
            scraper:
              - 'Dockerfile.scraper'
              - 'requirements-scraper.txt'
            extractor:
              - 'Dockerfile.extractor'
              - 'requirements-extractor.txt'

  # 2. Build and Push only images with detected changes
  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any_image_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Notify on Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_TO }}" \
          -d "parse_mode=HTML" \
          -d "reply_parameters={\"message_id\":${{ needs.detect-changes.outputs.msg_id }}}" \
          -d "text=🏗️ BUILD STAGE STARTED 🏗️ %0A------------------------------------------------%0A%0A Repo: <a href='${{ github.server_url }}/${{ github.repository }}'>${{ github.repository }}</a> %0A Run: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>${{ github.run_id }}</a>"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@22b48a429f10e1de233237b5c534c9c3d2e41597

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Coeus App
        if: ${{ needs.detect-changes.outputs.app_changed == 'true' }}
        uses: docker/build-push-action@1d0c110a5d679453d30b396aa86f6bb6ae377b76
        with:
          context: .
          file: Dockerfile.app
          push: true
          tags: ghcr.io/8ohm-technologies/coeus-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Dagster Worker Playwright
        if: ${{ needs.detect-changes.outputs.playwright_worker_changed == 'true' }}
        uses: docker/build-push-action@1d0c110a5d679453d30b396aa86f6bb6ae377b76
        with:
          context: .
          file: Dockerfile.playwright_worker
          push: true
          tags: ghcr.io/8ohm-technologies/coeus-dagster-worker-playwright:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Dagster Webserver and Daemon
        if: ${{ needs.detect-changes.outputs.dagster_changed == 'true' }}
        uses: docker/build-push-action@1d0c110a5d679453d30b396aa86f6bb6ae377b76
        with:
          context: .
          file: Dockerfile.dagster
          push: true
          tags: |
            ghcr.io/8ohm-technologies/coeus-dagster-webserver:latest
            ghcr.io/8ohm-technologies/coeus-dagster-daemon:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Scraper Worker Image
        if: ${{ needs.detect-changes.outputs.scraper_changed == 'true' }}
        uses: docker/build-push-action@1d0c110a5d679453d30b396aa86f6bb6ae377b76
        with:
          context: .
          file: Dockerfile.scraper
          push: true
          tags: ghcr.io/8ohm-technologies/coeus-scraper:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push LLM Extractor Image
        if: ${{ needs.detect-changes.outputs.extractor_changed == 'true' }}
        uses: docker/build-push-action@1d0c110a5d679453d30b396aa86f6bb6ae377b76
        with:
          context: .
          file: Dockerfile.extractor
          push: true
          tags: ghcr.io/8ohm-technologies/coeus-extractor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify on Success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_TO }}" \
          -d "parse_mode=HTML" \
          -d "reply_parameters={\"message_id\":${{ needs.detect-changes.outputs.msg_id }}}" \
          -d "text=✅ BUILD STAGE COMPLETED ✅ %0A------------------------------------------------%0A%0A Repo: <a href='${{ github.server_url }}/${{ github.repository }}'>${{ github.repository }}</a> %0A Run: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>${{ github.run_id }}</a>"

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_TO }}" \
          -d "parse_mode=HTML" \
          -d "reply_parameters={\"message_id\":${{ needs.detect-changes.outputs.msg_id }}}" \
          -d "text=❌ BUILD STAGE FAILED ❌ %0A------------------------------------------------%0A%0A Repo: <a href='${{ github.server_url }}/${{ github.repository }}'>${{ github.repository }}</a> %0A Run: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>${{ github.run_id }}</a>"

  # 3. Always deploy (Performs a remote Git Pull and updates Docker)
  deploy:
    needs: [detect-changes, build-and-push]
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Notify on Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_TO }}" \
          -d "parse_mode=HTML" \
          -d "reply_parameters={\"message_id\":${{ needs.detect-changes.outputs.msg_id }}}" \
          -d "text=🚀 DEPLOY STAGE STARTED 🚀 %0A------------------------------------------------%0A%0A Repo: <a href='${{ github.server_url }}/${{ github.repository }}'>${{ github.repository }}</a> %0A Run: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>${{ github.run_id }}</a>"

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Cloudflared on Runner
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

      - name: Configure SSH ProxyCommand
        run: |
          mkdir -p ~/.ssh
          echo "Host ${{ secrets.SSH_HOST }}" >> ~/.ssh/config
          echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy via Git Pull on VPS
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            ssh -A -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'EOF'
              set -euo pipefail

              TARGET_DIR="/home/deploy-user/coeus"
              REPO_URL="git@github.com:8ohm-tiaanf/coeus.git"

              if [ ! -d "$TARGET_DIR/.git" ]; then
                echo "Initializing repository directory structure..."
                mkdir -p "$TARGET_DIR"
                cd "$TARGET_DIR"
                git init
                git remote add origin "$REPO_URL"
                git fetch origin
                git checkout -f main
              else
                cd "$TARGET_DIR"
                git reset --hard HEAD
                git pull origin main
              fi

              # Ensure shared scraping data directory exists and is world-writable
              # so isolated scraper/extractor containers can read and write freely.
              sudo mkdir -p /var/shared_scraping_data
              sudo chmod 777 /var/shared_scraping_data

              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d

              docker exec dagster-daemon test -f /opt/dagster/dagster_home/workspace.yaml
              docker exec dagster-worker-playwright test -f /opt/dagster/app/definitions.py

              docker image prune -f
            EOF

      - name: Notify on Success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_TO }}" \
          -d "parse_mode=HTML" \
          -d "reply_parameters={\"message_id\":${{ needs.detect-changes.outputs.msg_id }}}" \
          -d "text=✅ DEPLOY STAGE COMPLETED ✅  %0A------------------------------------------------%0A%0A Repo: <a href='${{ github.server_url }}/${{ github.repository }}'>${{ github.repository }}</a> %0A Run: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>${{ github.run_id }}</a>"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_TO }}" \
          -d "parse_mode=HTML" \
          -d "reply_parameters={\"message_id\":${{ needs.detect-changes.outputs.msg_id }}}" \
          -d "text=🏝️ COMPLETED ${{github.workflow}} 🏝️ %0A------------------------------------------------------------------------%0A%0A Repo: <a href='${{ github.server_url }}/${{ github.repository }}'>${{ github.repository }}</a> %0A Run: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>${{ github.run_id }}</a>"

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_TO }}" \
          -d "parse_mode=HTML" \
          -d "reply_parameters={\"message_id\":${{ needs.detect-changes.outputs.msg_id }}}" \
          -d "text=❌ DEPLOY STAGE FAILED ❌ %0A------------------------------------------------%0A%0A Repo: <a href='${{ github.server_url }}/${{ github.repository }}'>${{ github.repository }}</a> %0A Run: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>${{ github.run_id }}</a>"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_TO }}" \
          -d "parse_mode=HTML" \
          -d "reply_parameters={\"message_id\":${{ needs.detect-changes.outputs.msg_id }}}" \
          -d "text=❌ FAILED ${{github.workflow}} ❌ %0A------------------------------------------------------------------------%0A%0A Repo: <a href='${{ github.server_url }}/${{ github.repository }}'>${{ github.repository }}</a> %0A Run: <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>${{ github.run_id }}</a>"