  #     ADMIN_CORS: http://localhost:5173,http://ohmshop.localhost,https://docs.medusajs.com
  #     AUTH_CORS: http://localhost:5173,http://ohmshop.localhost,https://docs.medusajs.com
  #     JWT_SECRET: supersecret
  #     COOKIE_SECRET: supersecret
  #   networks:
  #     - 8ohm-network
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.ohmshop.rule=Host(`ohmshop.localhost`)"
  #     - "traefik.http.services.ohmshop.loadbalancer.server.port=9000"
  #     - "traefik.docker.network=8ohm-network"
  #   restart: always

volumes:
  huggingface_cache:
  airflow_logs:
  postgres_data:

networks:
  8ohm-network:
    name: 8ohm-network
    driver: bridge
