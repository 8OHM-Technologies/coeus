name: Deploy to AbsoluteHostingVPS

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push App & Worker
        run: |
          # 1. Build and push the App image
          docker build -f Dockerfile.app -t ghcr.io/8ohm-technologies/coeus-app:latest .
          docker push ghcr.io/8ohm-technologies/coeus-app:latest
          
          # 2. Build and push the Worker image
          docker build -f Dockerfile.worker -t ghcr.io/8ohm-technologies/coeus-worker:latest .
          docker push ghcr.io/8ohm-technologies/coeus-worker:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository in this job
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 

      # 2. Copy the updated compose file and landing page to the VPS
      - name: Copy files to VPS
        uses: appleboy/scp-action@a6e43c3aaf4e8e6b0b15bf34e19d71118f6b1ca7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Specify the files and directories to copy, separated by commas
          source: "docker-compose-vps.yml,path/to/landing_page/" 
          target: "/home/deploy-user/coeus/"
          strip_components: 0

      # 3. Execute the deployment
      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/deploy-user/coeus/
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Explicitly target your VPS compose file
            docker compose -f docker-compose-vps.yml pull
            docker compose -f docker-compose-vps.yml up -d
            
            docker image prune -f