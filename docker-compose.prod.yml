version: "3.8"

services:
  # ---------------------------------------------------------
  # 0. Edge Router / Reverse Proxy (Traefik with TLS Auto-Renew)
  # ---------------------------------------------------------
  traefik:
    image: traefik:latest
    container_name: traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/deploy-user/coeus/traefik-config:/etc/traefik/dynamic:ro
    networks:
      - 8ohm-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # 1. PostgreSQL DB
  # ---------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    command: >
      postgres -c shared_buffers=256MB -c work_mem=16MB -c maintenance_work_mem=64MB -c max_connections=50 -c effective_cache_size=768MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "100.71.253.103:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - 8ohm-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # 2. Redis Cache Service (Used by MedusaJS, Airflow, Bookstack)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - 8ohm-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # 3. Django Application Backend (Control Plane)
  # ---------------------------------------------------------
  control-plane:
    image: ghcr.io/8ohm-technologies/coeus-app:latest
    container_name: coeus-control-plane
    depends_on:
      - postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-plane.rule=Host(`control-plane.8ohm.co.za`)"
      - "traefik.http.routers.control-plane.entrypoints=websecure"
      - "traefik.http.routers.control-plane.tls=true"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8001"
      - "traefik.docker.network=8ohm-network"
    command: >
      bash -c "python control_plane/manage.py migrate && python control_plane/manage.py collectstatic --noinput && gunicorn core.wsgi:application --chdir control_plane --bind 0.0.0.0:8001 --workers 3"

  # ---------------------------------------------------------
  # 4.1 Dagster Worker
  # ---------------------------------------------------------
  dagster-worker:
    image: ghcr.io/8ohm-technologies/coeus-dagster-worker:latest
    container_name: dagster-worker
    depends_on:
      - postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DAGSTER_CURRENT_IMAGE: "ghcr.io/8ohm-technologies/coeus-dagster-worker:latest"
    volumes:
      - ./data:/var/shared_scraping_data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [ "CMD", "dagster", "api", "grpc-health-check", "-p", "4000" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 4.2 Dagster Webserver
  # ---------------------------------------------------------
  dagster-webserver:
    image: ghcr.io/8ohm-technologies/coeus-dagster-webserver:latest
    container_name: dagster-webserver
    depends_on:
      postgres:
        condition: service_healthy
      dagster-worker:
        condition: service_started
    restart: unless-stopped
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - workspace.yaml
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dagster.rule=Host(`dagster.8ohm.co.za`)"
      - "traefik.http.routers.dagster.entrypoints=websecure"
      - "traefik.http.routers.dagster.tls=true"
      - "traefik.http.services.dagster.loadbalancer.server.port=3000"
      - "traefik.docker.network=8ohm-network"

  # ---------------------------------------------------------
  # 4.3 Dagster Daemon
  # ---------------------------------------------------------
  dagster-daemon:
    image: ghcr.io/8ohm-technologies/coeus-dagster-daemon:latest
    container_name: dagster-daemon
    depends_on:
      postgres:
        condition: service_healthy
      dagster-worker:
        condition: service_started
    restart: on-failure
    entrypoint:
      - dagster-daemon
      - run
    env_file:
      - .env
    environment:
      DAGSTER_CURRENT_IMAGE: "ghcr.io/8ohm-technologies/coeus-dagster-daemon:latest"
      DAGSTER_SCRAPER_IMAGE: "ghcr.io/8ohm-technologies/coeus-scraper:latest"
      DAGSTER_EXTRACTOR_IMAGE: "ghcr.io/8ohm-technologies/coeus-extractor:latest"
    volumes:
      - ./data:/var/shared_scraping_data
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 5.1 ohmbase Application (BookStack)
  # ---------------------------------------------------------
  ohmbase:
    image: ghcr.io/linuxserver/bookstack:latest
    container_name: ohmbase
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
      - APP_URL=http://ohmbase.8ohm.co.za
      # docker run -it --rm --entrypoint /bin/bash lscr.io/linuxserver/bookstack:latest appkey
      - APP_KEY=base64:3qjlIoUX4Tw6fUQgZcxMbz6lb8+dAzqpvItqHvahW1c=

      - DB_HOST=ohmbase-mariadb
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=bookstack
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./ohmbase/bookstack_app_data:/config
    networks:
      - 8ohm-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ohmbase.rule=Host(`ohmbase.8ohm.co.za`)"
      - "traefik.http.routers.ohmbase.entrypoints=websecure"
      - "traefik.http.routers.ohmbase.tls=true"
      - "traefik.http.services.ohmbase.loadbalancer.server.port=80"
      - "traefik.docker.network=8ohm-network"

  # ---------------------------------------------------------
  # 5.2 ohmbase MariaDB
  # ---------------------------------------------------------
  ohmbase-mariadb:
    image: ghcr.io/linuxserver/mariadb:latest
    container_name: ohmbase-mariadb
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
      - MYSQL_ROOT_PASSWORD=mysupersecretrootpassword
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=bookstack8432
    volumes:
      - ./ohmbase/bookstack_db_data:/config
    networks:
      - 8ohm-network
    restart: unless-stopped

volumes:
  traefik_certificates:
  static_assets:
  postgres_data:

networks:
  8ohm-network:
    name: 8ohm-network
    driver: bridge
