version: "3.8"

services:
  # ---------------------------------------------------------
  # 0. Edge Router / Reverse Proxy (Traefik)
  # ---------------------------------------------------------
  traefik:
    image: traefik:latest
    container_name: coeus-traefik
    environment:
      - TZ=Africa/Johannesburg
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--log.level=DEBUG"
      - "--log.filePath=/logs/traefik.log"
      - "--accesslog.filePath=/logs/access.log"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ohmbase/logs:/logs
    networks:
      - 8ohm-network
    restart: always

  # ---------------------------------------------------------
  # 1. PostgreSQL DB
  # ---------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: coeus-postgres
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres -c shared_buffers=256MB -c work_mem=16MB -c maintenance_work_mem=64MB -c max_connections=50 -c effective_cache_size=768MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 2. Django Application Backend (Control Plane)
  # ---------------------------------------------------------
  control_plane:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: coeus-control-plane
    image: coeus_app_image
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@coeus.local
      DJANGO_SUPERUSER_PASSWORD: admin
      DEBUG: "True"
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./control_plane:/app/control_plane
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-plane.rule=Host(`control-plane.localhost`)"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8001"
      - "traefik.docker.network=8ohm-network"
    command: >
      bash -c "python control_plane/manage.py makemigrations &&
                python control_plane/manage.py migrate &&
                python control_plane/manage.py createsuperuser --noinput || true &&
                python control_plane/manage.py runserver 0.0.0.0:8001"
    restart: always

  # ---------------------------------------------------------
  # 3. Extraction Worker Unit (Playwright)
  # ---------------------------------------------------------
  pipeline_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: coeus-worker
    image: coeus_worker_image
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./data:/app/data
      - huggingface_cache:/app/huggingface_cache
      - ./extraction_workers:/app/extraction_workers
      - ./misstcha:/app/misstcha
    networks:
      - 8ohm-network
    command: tail -f /dev/null
    restart: always

  # ---------------------------------------------------------
  # 4a. Airflow Scheduler Daemon
  # ---------------------------------------------------------
  airflow_scheduler:
    image: apache/airflow:2.9.1-python3.11
    container_name: coeus-airflow-scheduler
    restart: always
    user: "${AIRFLOW_UID:-50000}"
    depends_on:
      - postgres
    ports:
      - "9002:8080"
    env_file:
      - .env
    environment:
      AIRFLOW__WEBSERVER__WEB_SERVER_HOST: 0.0.0.0
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_SQL_ALCHEMY_CONN}
      HOST_DATA_PATH: ${PWD}/data
      COEUS_API_URL: ${COEUS_API_URL}
      PYTHONPATH: /opt/airflow/extraction_workers
    volumes:
      - ${PWD}/orchestration/airflow_dags:/opt/airflow/dags
      - ${PWD}/extraction_workers:/opt/airflow/extraction_workers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - airflow_logs:/opt/airflow/logs
    networks:
      - 8ohm-network
    command: scheduler

  # ---------------------------------------------------------
  # 4b. Airflow Web Management UI
  # ---------------------------------------------------------
  airflow_webserver:
    image: apache/airflow:2.9.1-python3.11
    container_name: coeus-airflow-webserver
    restart: always
    user: "${AIRFLOW_UID:-50000}"
    depends_on:
      - postgres
      - airflow_scheduler
    ports:
      - "9001:8080"
    env_file:
      - .env
    environment:
      AIRFLOW__WEBSERVER__WEB_SERVER_HOST: 0.0.0.0
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_SQL_ALCHEMY_CONN}
      HOST_DATA_PATH: ${PWD}/data
      COEUS_API_URL: ${COEUS_API_URL}
      PYTHONPATH: /opt/airflow/extraction_workers
    volumes:
      - ${PWD}/orchestration/airflow_dags:/opt/airflow/dags
      - ${PWD}/extraction_workers:/opt/airflow/extraction_workers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - airflow_logs:/opt/airflow/logs
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airflow.rule=Host(`airflow.localhost`)"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"
      - "traefik.docker.network=8ohm-network"
    command: >
      bash -c "airflow db upgrade &&
                airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@coeus.local || true &&
                airflow webserver"

  # ---------------------------------------------------------
  # 5. Marketing / Main Landing Page (Nginx)
  # ---------------------------------------------------------
  landing_page:
    image: nginx:alpine
    container_name: coeus-landing-page
    restart: always
    volumes:
      - ./landing_page:/usr/share/nginx/html:ro
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing-page.rule=Host(`8ohm.localhost`) || Host(`localhost`)"
      - "traefik.http.services.landing-page.loadbalancer.server.port=80"
      - "traefik.docker.network=8ohm-network"

  # ---------------------------------------------------------
  # 6a. ohmbase Application (BookStack)
  # ---------------------------------------------------------
  ohmbase:
    image: ghcr.io/linuxserver/bookstack:latest
    container_name: ohmbase
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
      - APP_URL=http://ohmbase.localhost
      # docker run -it --rm --entrypoint /bin/bash lscr.io/linuxserver/bookstack:latest appkey
      - APP_KEY=base64:3qjlIoUX4Tw6fUQgZcxMbz6lb8+dAzqpvItqHvahW1c=

      - DB_HOST=ohmbase-mariadb
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=bookstack
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./bookstack_app_data:/config
    networks:
      - 8ohm-network
    ports:
      - 6875:80
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ohmbase.rule=Host(`ohmbase.localhost`)"
      - "traefik.http.services.ohmbase.loadbalancer.server.port=80"
      - "traefik.docker.network=8ohm-network"

  # ---------------------------------------------------------
  # 6b. ohmbase MariaDB
  # ---------------------------------------------------------
  ohmbase_mariadb:
    image: ghcr.io/linuxserver/mariadb:latest
    container_name: ohmbase-mariadb
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
      - MYSQL_ROOT_PASSWORD=mysupersecretrootpassword
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=bookstack8432
    volumes:
      - ./bookstack_db_data:/config
    networks:
      - 8ohm-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # 7a. Redis Cache Service
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: coeus-redis
    networks:
      - 8ohm-network
    restart: always

  # ---------------------------------------------------------
  # 7b. MedusaJS OhmShop Backend & Admin (ohmshop-server)
  # ---------------------------------------------------------
  ohmshop-server:
    build:
      context: ./ohmshop
      dockerfile: Dockerfile
      target: base
    container_name: coeus-ohmshop-server
    depends_on:
      - postgres
      - redis
    command: sh -c "pnpm --filter=@dtc/backend exec medusa db:migrate && pnpm run backend:dev"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${MEDUSA_DATABASE_URL}
      REDIS_URL: redis://redis:6379
      STORE_CORS: http://localhost:8000,http://ohmshop.localhost,https://docs.medusajs.com
      ADMIN_CORS: http://localhost:5173,http://localhost:9000,http://ohmshop-server.localhost,http://ohmshop-admin.localhost,https://docs.medusajs.com
      AUTH_CORS: http://localhost:5173,http://localhost:9000,http://ohmshop-server.localhost,http://ohmshop-admin.localhost,https://docs.medusajs.com
      JWT_SECRET: ${MEDUSA_JWT_SECRET}
      COOKIE_SECRET: ${MEDUSA_COOKIE_SECRET}
    volumes:
      - ./ohmshop:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/apps/storefront/node_modules
      - /app/apps/backend/.medusa
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      # API / Backend Route
      - "traefik.http.routers.ohmshop-server.rule=Host(`ohmshop-server.localhost`)"
      - "traefik.http.routers.ohmshop-server.service=ohmshop-server-api"
      - "traefik.http.services.ohmshop-server-api.loadbalancer.server.port=9000"
      # Dev Admin Dashboard Route
      - "traefik.http.routers.ohmshop-admin.rule=Host(`ohmshop-admin.localhost`)"
      - "traefik.http.routers.ohmshop-admin.service=ohmshop-server-admin"
      - "traefik.http.services.ohmshop-server-admin.loadbalancer.server.port=5173"
      - "traefik.docker.network=8ohm-network"
    restart: always

  # ---------------------------------------------------------
  # 7c. Next.js OhmShop Storefront (ohmshop)
  # ---------------------------------------------------------
  ohmshop:
    build:
      context: ./ohmshop
      dockerfile: Dockerfile
      target: base
    container_name: coeus-ohmshop
    depends_on:
      - ohmshop-server
    command: pnpm run storefront:dev
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://ohmshop-server.localhost
      NEXT_PUBLIC_DEFAULT_REGION: za
      NEXT_PUBLIC_BASE_URL: http://ohmshop.localhost
    volumes:
      - ./ohmshop:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/apps/storefront/node_modules
    extra_hosts:
      - "ohmshop-server.localhost:host-gateway"
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ohmshop.rule=Host(`ohmshop.localhost`)"
      - "traefik.http.services.ohmshop.loadbalancer.server.port=8000"
      - "traefik.docker.network=8ohm-network"
    restart: always
volumes:
  huggingface_cache:
  airflow_logs:
  postgres_data:

networks:
  8ohm-network:
    name: 8ohm-network
    driver: bridge
