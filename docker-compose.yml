version: "3.8"

services:
  # ---------------------------------------------------------
  # 0. Edge Router / Reverse Proxy (Traefik)
  # ---------------------------------------------------------
  traefik:
    image: traefik:latest
    container_name: traefik
    environment:
      - TZ=Africa/Johannesburg
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--log.level=DEBUG"
      - "--log.filePath=/logs/traefik.log"
      - "--accesslog.filePath=/logs/access.log"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "8085:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ohmbase/logs:/logs
    networks:
      - 8ohm-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # 1. PostgreSQL DB
  # ---------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    command: >
      postgres -c shared_buffers=256MB -c work_mem=16MB -c maintenance_work_mem=64MB -c max_connections=200 -c effective_cache_size=768MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    networks:
      - 8ohm-network
    ports:
      - 5433:5432
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postgres.rule=Host(`postgres.localhost`)"
      - "traefik.http.services.postgres.loadbalancer.server.port=5432"
      - "traefik.docker.network=8ohm-network"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # 2. Redis Cache Service (Used by MedusaJS, Airflow, Bookstack)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - 8ohm-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # 3. Django Application Backend (Control Plane)
  # ---------------------------------------------------------
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: coeus-control-plane
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./control_plane:/app/control_plane
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-plane.rule=Host(`control-plane.localhost`)"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8001"
      - "traefik.docker.network=8ohm-network"
    command: >
      bash -c "python control_plane/manage.py makemigrations &&
                python control_plane/manage.py migrate &&
                python control_plane/manage.py createsuperuser --noinput || true &&
                python control_plane/manage.py runserver 0.0.0.0:8001"
    restart: unless-stopped

  # ---------------------------------------------------------
  # 4.1 Dagster Worker
  # ---------------------------------------------------------
  dagster-worker:
    image: coeus-dagster-worker
    container_name: dagster-worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DAGSTER_CURRENT_IMAGE: "coeus-dagster-worker"
    volumes:
      - ./data:/var/shared_scraping_data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [ "CMD", "dagster", "api", "grpc-health-check", "-p", "4000" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 4.2 Dagster Webserver
  # ---------------------------------------------------------
  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: dagster-webserver
    depends_on:
      postgres:
        condition: service_healthy
      dagster-worker:
        condition: service_started
    restart: unless-stopped
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - workspace.yaml
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dagster.rule=Host(`dagster.localhost`)"
      - "traefik.http.services.dagster.loadbalancer.server.port=3000"
      - "traefik.docker.network=8ohm-network"

  # ---------------------------------------------------------
  # 4.3 Dagster Daemon
  # ---------------------------------------------------------
  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: dagster-daemon
    depends_on:
      postgres:
        condition: service_healthy
      dagster-worker:
        condition: service_started
    restart: on-failure
    entrypoint:
      - dagster-daemon
      - run
    env_file:
      - .env
    environment:
      DAGSTER_CURRENT_IMAGE: "coeus-dagster-daemon"
      DAGSTER_SCRAPER_IMAGE: "coeus-scraper"
      DAGSTER_EXTRACTOR_IMAGE: "coeus-extractor"
    volumes:
      - ./data:/var/shared_scraping_data
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 4.4 Pipes Worker Images (Build-only, not run as services)
  # ---------------------------------------------------------
  coeus-scraper:
    image: coeus-scraper
    build:
      context: .
      dockerfile: Dockerfile.scraper
    env_file:
      - .env
    profiles:
      - build-only

  coeus-extractor:
    image: coeus-extractor
    build:
      context: .
      dockerfile: Dockerfile.extractor
    env_file:
      - .env
    profiles:
      - build-only

