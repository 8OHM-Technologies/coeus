[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hcaptcha-solver"
version = "0.1.0"
description = "An automated hCaptcha solver using Playwright and Grounding DINO zero-shot object detection."
authors = [
    { name = "Coeus Engineering" }
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "playwright>=1.40.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "Pillow>=9.0.0",
]

[project.urls]
"Homepage" = "https://github.com/x3nZA/coeus"

[tool.setuptools.packages.find]
where = ["src"]
include = ["solver*"]
