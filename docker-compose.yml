version: "3.8"

services:
  # ---------------------------------------------------------
  # 0. Edge Router / Reverse Proxy (Traefik)
  # ---------------------------------------------------------
  traefik:
    image: traefik:latest
    container_name: traefik
    environment:
      - TZ=Africa/Johannesburg
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--log.level=DEBUG"
      - "--log.filePath=/logs/traefik.log"
      - "--accesslog.filePath=/logs/access.log"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ohmbase/logs:/logs
    networks:
      - 8ohm-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # 1. PostgreSQL DB
  # ---------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    command: >
      postgres -c shared_buffers=256MB -c work_mem=16MB -c maintenance_work_mem=64MB -c max_connections=200 -c effective_cache_size=768MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 2. Django Application Backend (Control Plane)
  # ---------------------------------------------------------
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: coeus-control-plane
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@coeus.local
      DJANGO_SUPERUSER_PASSWORD: admin
      DEBUG: "True"
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./control-plane:/app/control-plane
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-plane.rule=Host(`control-plane.localhost`)"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8001"
      - "traefik.docker.network=8ohm-network"
    command: >
      bash -c "python control-plane/manage.py makemigrations &&
                python control-plane/manage.py migrate &&
                python control-plane/manage.py createsuperuser --noinput || true &&
                python control-plane/manage.py runserver 0.0.0.0:8001"
    restart: unless-stopped

  # ---------------------------------------------------------
  # 3. Extraction Worker Unit (Playwright)
  # ---------------------------------------------------------
  pipeline-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: coeus-pipelineworker
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./data:/app/data
      - huggingface_cache:/app/huggingface_cache
      - ./extraction_workers:/app/extraction_workers
      - ./misstcha:/app/misstcha
    networks:
      - 8ohm-network
    command: tail -f /dev/null
    restart: unless-stopped

  # ---------------------------------------------------------
  # 4a. Airflow Scheduler Daemon
  # ---------------------------------------------------------
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: coeus-airflow:local
    container_name: coeus-airflow-scheduler
    restart: unless-stopped
    user: "${AIRFLOW_UID:-50000}"
    depends_on:
      - postgres
    ports:
      - "9002:8080"
    env_file:
      - .env
    environment:
      AIRFLOW__WEBSERVER__WEB_SERVER_HOST: 0.0.0.0
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_SQL_ALCHEMY_CONN}
      HOST_DATA_PATH: ${PWD}/data
      COEUS_API_URL: ${COEUS_API_URL}
      PYTHONPATH: /opt/airflow/extraction_workers
    volumes:
      - ${PWD}/orchestration/airflow_dags:/opt/airflow/dags
      - ${PWD}/extraction_workers:/opt/airflow/extraction_workers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - airflow_logs:/opt/airflow/logs
    networks:
      - 8ohm-network
    command: scheduler

  # ---------------------------------------------------------
  # 4b. Airflow Web Management UI
  # ---------------------------------------------------------
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: coeus-airflow:local
    container_name: coeus-airflow-webserver
    restart: unless-stopped
    user: "${AIRFLOW_UID:-50000}"
    depends_on:
      - postgres
      - airflow-scheduler
    ports:
      - "9001:8080"
    env_file:
      - .env
    environment:
      AIRFLOW__WEBSERVER__WEB_SERVER_HOST: 0.0.0.0
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_SQL_ALCHEMY_CONN}
      HOST_DATA_PATH: ${PWD}/data
      COEUS_API_URL: ${COEUS_API_URL}
      PYTHONPATH: /opt/airflow/extraction_workers
    volumes:
      - ${PWD}/orchestration/airflow_dags:/opt/airflow/dags
      - ${PWD}/extraction_workers:/opt/airflow/extraction_workers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - airflow_logs:/opt/airflow/logs
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airflow.rule=Host(`airflow.localhost`)"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"
      - "traefik.docker.network=8ohm-network"
    command: >
      bash -c "airflow db upgrade &&
                airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@coeus.local || true &&
                airflow webserver"

  # ---------------------------------------------------------
  # 5. Marketing / Main Landing Page (Nginx)
  # ---------------------------------------------------------
  landing-page:
    image: nginx:alpine
    container_name: landing-page
    restart: unless-stopped
    volumes:
      - ./landing_page:/usr/share/nginx/html:ro
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing-page.rule=Host(`8ohm.localhost`) || Host(`localhost`)"
      - "traefik.http.services.landing-page.loadbalancer.server.port=80"
      - "traefik.docker.network=8ohm-network"

  # ---------------------------------------------------------
  # 6a. ohmbase Application (BookStack)
  # ---------------------------------------------------------
  ohmbase:
    image: ghcr.io/linuxserver/bookstack:latest
    container_name: ohmbase
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
      - APP_URL=http://ohmbase.localhost
      # docker run -it --rm --entrypoint /bin/bash lscr.io/linuxserver/bookstack:latest appkey
      - APP_KEY=base64:3qjlIoUX4Tw6fUQgZcxMbz6lb8+dAzqpvItqHvahW1c=

      - DB_HOST=ohmbase-mariadb
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=bookstack
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./bookstack_app_data:/config
    networks:
      - 8ohm-network
    ports:
      - 6875:80
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ohmbase.rule=Host(`ohmbase.localhost`)"
      - "traefik.http.services.ohmbase.loadbalancer.server.port=80"
      - "traefik.docker.network=8ohm-network"

  # ---------------------------------------------------------
  # 6b. ohmbase MariaDB
  # ---------------------------------------------------------
  ohmbase-mariadb:
    image: ghcr.io/linuxserver/mariadb:latest
    container_name: ohmbase-mariadb
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
      - MYSQL_ROOT_PASSWORD=mysupersecretrootpassword
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=bookstack8432
    volumes:
      - ./bookstack_db_data:/config
    networks:
      - 8ohm-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # 7a. Redis Cache Service
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - 8ohm-network
    restart: unless-stopped

volumes:
  huggingface_cache:
  airflow_logs:
  postgres_data:

networks:
  8ohm-network:
    name: 8ohm-network
    driver: bridge
