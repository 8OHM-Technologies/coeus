services:
  # ---------------------------------------------------------
  # 0. Database Proxy (Secure Tunnel to Cloud SQL)
  # ---------------------------------------------------------
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
    container_name: coeus-cloud-sql-proxy
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${INSTANCE_CONNECTION_NAME}"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /config/application_default_credentials.json
    volumes:
      - C:\Users\tiaan\AppData\Roaming\gcloud:/config:ro
    networks:
      - coeus_network
    restart: always

  # ---------------------------------------------------------
  # 1. Reverse Proxy (Routing & Local DNS)
  # ---------------------------------------------------------
  traefik:
    image: traefik:latest
    container_name: coeus-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=tcp://host.docker.internal:2375"
      - "--entrypoints.web.address=:81"
    ports:
      - "81:80"
      - "8080:8080"
    networks:
      - coeus_network

  # ---------------------------------------------------------
  # 2. Control Plane / Orchestration UI
  # ---------------------------------------------------------
  control_plane:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: coeus-control-plane
    image: coeus_control_plane_image
    depends_on:
      - cloud-sql-proxy
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: cloud-sql-proxy
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@coeus.local
      DJANGO_SUPERUSER_PASSWORD: admin
    volumes:
      - ./:/app/
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - coeus_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-plane.rule=Host(`control-plane.localhost`)"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8001"
      - "traefik.docker.network=coeus_network"
    command: >
      bash -c "python control_plane/manage.py makemigrations &&
                python control_plane/manage.py migrate &&
                python control_plane/manage.py createsuperuser --noinput || true &&
                python control_plane/manage.py runserver 0.0.0.0:8001"

  # ---------------------------------------------------------
  # 3. Ingestion & Extraction Worker (Playwright + OpenAI)
  # ---------------------------------------------------------
  pipeline_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: coeus-worker
    image: coeus_worker_image
    depends_on:
      - cloud-sql-proxy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: cloud-sql-proxy
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./:/app
      - ./data:/app/data
      - ~/.cache/huggingface/hub:/app/huggingface_cache
    networks:
      - coeus_network
    command: tail -f /dev/null

  # ---------------------------------------------------------
  # 4. Orchestration (Apache Airflow Standalone)
  # ---------------------------------------------------------
  airflow:
    image: apache/airflow:2.9.1-python3.11
    container_name: coeus-airflow
    depends_on:
      - cloud-sql-proxy
    entrypoint: >
      /bin/bash -c " airflow standalone & echo 'Waiting for Airflow to boot...' && sleep 25 && airflow users reset-password --username admin --password admin && echo 'Admin password forced to: admin' && wait"
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: False
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_SQL_ALCHEMY_CONN}
      HOST_DATA_PATH: ${PWD}/data
      COEUS_API_URL: ${COEUS_API_URL}
    ports:
      - "9001:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airflow.rule=Host(`airflow.localhost`)"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"
      - "traefik.docker.network=coeus_network"
    volumes:
      - ./orchestration/airflow_dags:/opt/airflow/dags
      - ./:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - coeus_network

volumes:
  huggingface_cache:

networks:
  coeus_network:
    name: coeus_network
    driver: bridge
