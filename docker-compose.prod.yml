version: "3.8"

services:
  # ---------------------------------------------------------
  # 0. Edge Router / Reverse Proxy (Traefik with TLS Auto-Renew)
  # ---------------------------------------------------------
  traefik:
    image: traefik:latest
    container_name: traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/deploy-user/coeus/traefik-config:/etc/traefik/dynamic:ro
    networks:
      - 8ohm-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # 1. PostgreSQL DB
  # ---------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    command: >
      postgres -c shared_buffers=256MB -c work_mem=16MB -c maintenance_work_mem=64MB -c max_connections=50 -c effective_cache_size=768MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "100.71.253.103:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - 8ohm-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # 2. Redis Cache Service (Used by MedusaJS, Airflow, Bookstack)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - 8ohm-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # 3. Marketing / Main Landing Page (Nginx)
  # ---------------------------------------------------------
  landing-page:
    image: nginx:alpine
    container_name: landing-page
    restart: unless-stopped
    volumes:
      - /home/deploy-user/coeus/landing_page:/usr/share/nginx/html:ro
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing-page.rule=Host(`8ohm.co.za`) || Host(`www.8ohm.co.za`)"
      - "traefik.http.routers.landing-page.entrypoints=websecure"
      - "traefik.http.routers.landing-page.tls=true"
      - "traefik.http.services.landing-page.loadbalancer.server.port=80"
      - "traefik.docker.network=8ohm-network"

  # ---------------------------------------------------------
  # 4. Django Application Backend (Control Plane)
  # ---------------------------------------------------------
  control-plane:
    image: ghcr.io/8ohm-technologies/coeus-app:latest
    container_name: coeus-control-plane
    depends_on:
      - postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-plane.rule=Host(`control-plane.8ohm.co.za`)"
      - "traefik.http.routers.control-plane.entrypoints=websecure"
      - "traefik.http.routers.control-plane.tls=true"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8001"
      - "traefik.docker.network=8ohm-network"
    command: >
      bash -c "python control_plane/manage.py migrate && python control_plane/manage.py collectstatic --noinput && gunicorn core.wsgi:application --chdir control_plane --bind 0.0.0.0:8001 --workers 3"

  # ---------------------------------------------------------
  # 5.1 Dagster Worker (Playwright)
  # ---------------------------------------------------------
  dagster-worker-playwright:
    image: ghcr.io/8ohm-technologies/coeus-dagster-worker-playwright:latest
    container_name: dagster-worker-playwright
    depends_on:
      - postgres
    restart: unless-stopped
    environment:
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB}
      DAGSTER_CURRENT_IMAGE: "coeus-dagster-worker-playwright"
      COEUS_API_URL: ${COEUS_API_URL}

      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - /home/deploy-user/coeus/data:/app/data
      - huggingface_cache:/app/huggingface_cache
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 5a. Dagster Webserver
  # ---------------------------------------------------------
  dagster-webserver:
    image: ghcr.io/8ohm-technologies/coeus-dagster-webserver:latest
    container_name: dagster-webserver
    depends_on:
      postgres:
        condition: service_healthy
      dagster-worker-playwright:
        condition: service_started
    restart: unless-stopped
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - workspace.yaml
    environment:
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB}
      COEUS_API_URL: ${COEUS_API_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dagster.rule=Host(`dagster.8ohm.co.za`)"
      - "traefik.http.routers.dagster.entrypoints=websecure"
      - "traefik.http.routers.dagster.tls=true"
      - "traefik.http.services.dagster.loadbalancer.server.port=3000"
      - "traefik.docker.network=8ohm-network"

  # ---------------------------------------------------------
  # 5b. Dagster Daemon
  # ---------------------------------------------------------
  dagster-daemon:
    image: ghcr.io/8ohm-technologies/coeus-dagster-daemon:latest
    container_name: dagster-daemon
    depends_on:
      postgres:
        condition: service_healthy
      dagster-worker-playwright:
        condition: service_started
    restart: on-failure
    entrypoint:
      - dagster-daemon
      - run
    environment:
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB}
      COEUS_API_URL: ${COEUS_API_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 6a. ohmbase Application (BookStack)
  # ---------------------------------------------------------
  ohmbase:
    image: ghcr.io/linuxserver/bookstack:latest
    container_name: ohmbase
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
      - APP_URL=http://ohmbase.8ohm.co.za
      # docker run -it --rm --entrypoint /bin/bash lscr.io/linuxserver/bookstack:latest appkey
      - APP_KEY=base64:3qjlIoUX4Tw6fUQgZcxMbz6lb8+dAzqpvItqHvahW1c=

      - DB_HOST=ohmbase-mariadb
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=bookstack
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./ohmbase/bookstack_app_data:/config
    networks:
      - 8ohm-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ohmbase.rule=Host(`ohmbase.8ohm.co.za`)"
      - "traefik.http.routers.ohmbase.entrypoints=websecure"
      - "traefik.http.routers.ohmbase.tls=true"
      - "traefik.http.services.ohmbase.loadbalancer.server.port=80"
      - "traefik.docker.network=8ohm-network"

  # ---------------------------------------------------------
  # 6b. ohmbase MariaDB
  # ---------------------------------------------------------
  ohmbase-mariadb:
    image: ghcr.io/linuxserver/mariadb:latest
    container_name: ohmbase-mariadb
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
      - MYSQL_ROOT_PASSWORD=mysupersecretrootpassword
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=bookstack8432
    volumes:
      - ./ohmbase/bookstack_db_data:/config
    networks:
      - 8ohm-network
    restart: unless-stopped

volumes:
  traefik_certificates:
  static_assets:
  huggingface_cache:
  postgres_data:

networks:
  8ohm-network:
    name: 8ohm-network
    driver: bridge
