name: Deploy to AbsoluteHostingVPS

on:
  push:
    branches: [ main ]

jobs:
  # 1. Detect if the backend/Docker files actually changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Check for file changes
        uses: dorny/paths-filter@f3ceefdc7ef57bc2d8560787d4b6c33e44044cec
        id: filter
        with:
          filters: |
            backend:
              - 'Dockerfile.*'
              - 'requirements*.txt'
              - 'control_plane/**'
              - 'extraction_workers/**'
              - 'solver/**'
              - 'ohmshop/**'

  # 2. Build and Push (Only runs if 'detect-changes' found backend updates)
  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@22b48a429f10e1de233237b5c534c9c3d2e41597
        
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Push App
        uses: docker/build-push-action@1d0c110a5d679453d30b396aa86f6bb6ae377b76
        with:
          context: .
          file: Dockerfile.app
          push: true
          tags: ghcr.io/8ohm-technologies/coeus-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build and Push Worker
        uses: docker/build-push-action@1d0c110a5d679453d30b396aa86f6bb6ae377b76
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ghcr.io/8ohm-technologies/coeus-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push OhmShop
        uses: docker/build-push-action@1d0c110a5d679453d30b396aa86f6bb6ae377b76
        with:
          context: ohmshop
          file: ohmshop/apps/backend/Dockerfile
          push: true
          tags: ghcr.io/8ohm-technologies/ohmshop:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Always deploy (Updates VPS compose and pulls new images if they were built)
  deploy:
    needs: [detect-changes, build-and-push]
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Install Cloudflared on Runner
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

      - name: Configure SSH ProxyCommand
        run: |
          mkdir -p ~/.ssh
          echo "Host ${{ secrets.SSH_HOST }}" >> ~/.ssh/config
          echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Copy files to VPS
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            set -o pipefail
            tar czf - docker-compose.prod.yml orchestration/airflow_dags extraction_workers | ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /home/deploy-user/coeus/ && tar xzf - -C /home/deploy-user/coeus/"

      - name: Deploy via SSH
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'EOF'
              set -euo pipefail
              cd /home/deploy-user/coeus/

              # Ensure bind-mounted DAG/worker paths are present and populated.
              test -f orchestration/airflow_dags/dynamic_factory.py
              test -n "$(ls -A extraction_workers)"

              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d

              # Fail fast if scheduler container still does not see DAG files.
              docker exec coeus-airflow-scheduler test -f /opt/airflow/dags/dynamic_factory.py
              docker exec coeus-airflow-scheduler sh -lc 'test -n "$(ls -A /opt/airflow/extraction_workers)"'
              
              docker image prune -f
            EOF