version: "3.8"

services:
  # ---------------------------------------------------------
  # 0. Secure Cloud SQL Proxy (With Health Checks)
  # ---------------------------------------------------------
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
    container_name: coeus-cloud-sql-proxy
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${INSTANCE_CONNECTION_NAME}"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /config/infinity-ohm-cloud-project-ba3373ab9eb5.json
    volumes:
      - /etc/coeus/gcloud:/config:ro
    networks:
      - 8ohm-network
    restart: always
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # 1. Edge Router / Reverse Proxy (Traefik with TLS Auto-Renew)
  # ---------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: coeus-traefik
    restart: always
    command:
      - "--api.dashboard=false" # Disabled insecure dashboard access
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Entrypoints setup
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Automated Let's Encrypt TLS challenge configs
      - "--certificatesresolvers.le-resolver.acme.tlschallenge=true"
      - "--certificatesresolvers.le-resolver.acme.email=${SSL_CERT_EMAIL}"
      - "--certificatesresolvers.le-resolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certificates:/letsencrypt
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 2. Django Application Backend (Control Plane)
  # ---------------------------------------------------------
  control_plane:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: coeus-control-plane
    image: coeus_app_image:latest
    restart: always
    depends_on:
      cloud-sql-proxy:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: cloud-sql-proxy
      DEBUG: "False"
    volumes:
      - static_assets:/app/static
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-plane.rule=Host(`control-plane.8ohm.co.za`)"
      - "traefik.http.routers.control-plane.entrypoints=websecure"
      - "traefik.http.routers.control-plane.tls.certresolver=le-resolver"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8001"
    command: >
      bash -c "python control_plane/manage.py migrate --noinput &&
                python control_plane/manage.py collectstatic --noinput &&
                gunicorn control_plane.wsgi:application --bind 0.0.0.0:8001 --workers 3"

  # ---------------------------------------------------------
  # 3. Extraction Worker Unit (Playwright)
  # ---------------------------------------------------------
  pipeline_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: coeus-worker
    image: coeus_worker_image:latest
    restart: always
    depends_on:
      cloud-sql-proxy:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: cloud-sql-proxy
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - production_data:/app/data
      - huggingface_cache:/app/huggingface_cache
    networks:
      - 8ohm-network
    command: celery -A coeus_worker worker --loglevel=info

  # ---------------------------------------------------------
  # 4a. Airflow Scheduler Daemon
  # ---------------------------------------------------------
  airflow_scheduler:
    image: apache/airflow:2.9.1-python3.11
    container_name: coeus-airflow-scheduler
    restart: always
    user: "${AIRFLOW_UID:-50000}"
    depends_on:
      cloud-sql-proxy:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/airflow/extraction_workers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/coeus/airflow_dags:/opt/airflow/dags:ro
      - /var/coeus/extraction_workers:/opt/airflow/extraction_workers:ro
    networks:
      - 8ohm-network
    command: scheduler

  # ---------------------------------------------------------
  # 4b. Airflow Web Management UI
  # ---------------------------------------------------------
  airflow_webserver:
    image: apache/airflow:2.9.1-python3.11
    container_name: coeus-airflow-webserver
    restart: always
    user: "${AIRFLOW_UID:-50000}"
    depends_on:
      cloud-sql-proxy:
        condition: service_healthy
      airflow_scheduler:
        condition: service_started
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    volumes:
      - /var/coeus/airflow_dags:/opt/airflow/dags:ro
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airflow.rule=Host(`airflow.8ohm.co.za`)"
      - "traefik.http.routers.airflow.entrypoints=websecure"
      - "traefik.http.routers.airflow.tls.certresolver=le-resolver"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"
    command: >
      bash -c "airflow db upgrade && webserver"

volumes:
  traefik_certificates:
  static_assets:
  production_data:
  huggingface_cache:

networks:
  8ohm-network:
    name: 8ohm-network
    driver: bridge