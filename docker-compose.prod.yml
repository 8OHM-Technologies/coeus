version: "3.8"

services:
  # ---------------------------------------------------------
  # 0. Edge Router / Reverse Proxy (Traefik with TLS Auto-Renew)
  # ---------------------------------------------------------
  traefik:
    image: traefik:latest
    container_name: coeus-traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/deploy-user/coeus/traefik-config:/etc/traefik/dynamic:ro
    networks:
      - 8ohm-network
    restart: always

  # ---------------------------------------------------------
  # 1. PostgreSQL DB
  # ---------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: coeus-postgres
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres -c shared_buffers=256MB -c work_mem=16MB -c maintenance_work_mem=64MB -c max_connections=50 -c effective_cache_size=768MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 2. Django Application Backend (Control Plane)
  # ---------------------------------------------------------
  control_plane:
    image: ghcr.io/8ohm-technologies/coeus-app:latest
    container_name: coeus-control-plane
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-plane.rule=Host(`control-plane.8ohm.co.za`)"
      - "traefik.http.routers.control-plane.entrypoints=websecure"
      - "traefik.http.routers.control-plane.tls=true"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8001"
      - "traefik.docker.network=8ohm-network"
    command: >
      bash -c "python control_plane/manage.py migrate && python control_plane/manage.py collectstatic --noinput && gunicorn core.wsgi:application --chdir control_plane --bind 0.0.0.0:8001 --workers 3"
    restart: always

  # ---------------------------------------------------------
  # 3. Extraction Worker Unit (Playwright)
  # ---------------------------------------------------------
  pipeline_worker:
    image: ghcr.io/8ohm-technologies/coeus-worker:latest
    container_name: coeus-pipeline-worker
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - /home/deploy-user/coeus/data:/app/data
      - huggingface_cache:/app/huggingface_cache
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 4a. Airflow Scheduler Daemon
  # ---------------------------------------------------------
  airflow_scheduler:
    image: apache/airflow:2.9.1-python3.11
    container_name: coeus-airflow-scheduler
    hostname: coeus-airflow-scheduler
    restart: always
    user: "50000:0"
    # Host docker group GID (verify with: getent group docker | cut -d: -f3)
    group_add:
      - "988"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "Africa/Johannesburg"
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: "Africa/Johannesburg"
      TZ: "Africa/Johannesburg"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      COEUS_API_URL: "http://coeus-control-plane:8001/api/pipelines/active/"
      HOST_DATA_PATH: "/home/deploy-user/coeus/data"
      PYTHONPATH: /opt/airflow/extraction_workers
      # Stable hostname for log serving when webserver falls back to HTTP fetch
      AIRFLOW__LOGGING__WORKER_LOG_SERVER_HOST: coeus-airflow-scheduler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - airflow_logs:/opt/airflow/logs
      - ./orchestration/airflow_dags:/opt/airflow/dags:ro
      - ./extraction_workers:/opt/airflow/extraction_workers:ro
    networks:
      - 8ohm-network
    command: scheduler

  # ---------------------------------------------------------
  # 4b. Airflow Web Management UI
  # ---------------------------------------------------------
  airflow_webserver:
    image: apache/airflow:2.9.1-python3.11
    container_name: coeus-airflow-webserver
    restart: always
    user: "${AIRFLOW_UID:-50000}"
    depends_on:
      - postgres
      - airflow_scheduler
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      COEUS_API_URL: "http://coeus-control-plane:8001/api/pipelines/active/"
      HOST_DATA_PATH: "/home/deploy-user/coeus/data"
      PYTHONPATH: /opt/airflow/extraction_workers
      AIRFLOW__LOGGING__WORKER_LOG_SERVER_HOST: coeus-airflow-scheduler
    volumes:
      - airflow_logs:/opt/airflow/logs
      - ./orchestration/airflow_dags:/opt/airflow/dags:ro
      - ./extraction_workers:/opt/airflow/extraction_workers:ro
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airflow.rule=Host(`airflow.8ohm.co.za`)"
      - "traefik.http.routers.airflow.entrypoints=websecure"
      - "traefik.http.routers.airflow.tls=true"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"
      - "traefik.docker.network=8ohm-network"
    command: >
      bash -c "airflow db upgrade && airflow webserver"

  # ---------------------------------------------------------
  # 5. Marketing / Main Landing Page (Nginx)
  # ---------------------------------------------------------
  landing_page:
    image: nginx:alpine
    container_name: coeus-landing-page
    restart: always
    volumes:
      - /home/deploy-user/coeus/landing_page:/usr/share/nginx/html:ro
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing-page.rule=Host(`8ohm.co.za`) || Host(`www.8ohm.co.za`)"
      - "traefik.http.routers.landing-page.entrypoints=websecure"
      - "traefik.http.routers.landing-page.tls=true"
      - "traefik.http.services.landing-page.loadbalancer.server.port=80"
      - "traefik.docker.network=8ohm-network"

  # ---------------------------------------------------------
  # 6a. ohmbase Application (BookStack)
  # ---------------------------------------------------------
  ohmbase:
    image: ghcr.io/linuxserver/bookstack:latest
    container_name: ohmbase
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
      - APP_URL=http://ohmbase.8ohm.co.za
      # docker run -it --rm --entrypoint /bin/bash lscr.io/linuxserver/bookstack:latest appkey
      - APP_KEY=base64:3qjlIoUX4Tw6fUQgZcxMbz6lb8+dAzqpvItqHvahW1c=

      - DB_HOST=ohmbase-mariadb
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=bookstack
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./bookstack_app_data:/config
    networks:
      - 8ohm-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ohmbase.rule=Host(`ohmbase.8ohm.co.za`)"
      - "traefik.http.routers.ohmbase.entrypoints=websecure"
      - "traefik.http.routers.ohmbase.tls=true"
      - "traefik.http.services.ohmbase.loadbalancer.server.port=80"
      - "traefik.docker.network=8ohm-network"

  # ---------------------------------------------------------
  # 6b. ohmbase MariaDB
  # ---------------------------------------------------------
  ohmbase_mariadb:
    image: ghcr.io/linuxserver/mariadb:latest
    container_name: ohmbase-mariadb
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
      - MYSQL_ROOT_PASSWORD=mysupersecretrootpassword
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=bookstack8432
    volumes:
      - ./bookstack_db_data:/config
    networks:
      - 8ohm-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # 7a. MedusaJS OhmShop Redis Cache Service
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: coeus-redis
    networks:
      - 8ohm-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # 7b. MedusaJS OhmShop Backend & Admin (ohmshop-server)
  # ---------------------------------------------------------
  ohmshop-server:
    image: ghcr.io/8ohm-technologies/coeus-ohmshop-server:latest
    container_name: coeus-ohmshop-server
    depends_on:
      - postgres
      - redis
    command: sh -c "pnpm --filter=@dtc/backend exec medusa db:migrate && pnpm --filter=@dtc/backend start"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${MEDUSA_DATABASE_URL}
      REDIS_URL: redis://redis:6379
      STORE_CORS: https://8ohm.co.za,https://ohmshop.8ohm.co.za,https://docs.medusajs.com
      ADMIN_CORS: https://ohmshop-server.8ohm.co.za,https://docs.medusajs.com
      AUTH_CORS: https://ohmshop-server.8ohm.co.za,https://docs.medusajs.com
      JWT_SECRET: ${MEDUSA_JWT_SECRET}
      COOKIE_SECRET: ${MEDUSA_COOKIE_SECRET}
    networks:
      - 8ohm-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ohmshop-server.rule=Host(`ohmshop-server.8ohm.co.za`)"
      - "traefik.http.routers.ohmshop-server.entrypoints=websecure"
      - "traefik.http.routers.ohmshop-server.tls=true"
      - "traefik.http.services.ohmshop-server.loadbalancer.server.port=9000"
      - "traefik.docker.network=8ohm-network"

  # ---------------------------------------------------------
  # 7c. Next.js OhmShop Storefront (ohmshop)
  # ---------------------------------------------------------
  ohmshop:
    image: ghcr.io/8ohm-technologies/coeus-ohmshop:latest
    container_name: coeus-ohmshop
    depends_on:
      - ohmshop-server
    command: pnpm --filter=@dtc/storefront start
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://ohmshop-server.8ohm.co.za
      NEXT_PUBLIC_DEFAULT_REGION: za
      NEXT_PUBLIC_BASE_URL: https://ohmshop.8ohm.co.za
    networks:
      - 8ohm-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ohmshop.rule=Host(`ohmshop.8ohm.co.za`)"
      - "traefik.http.routers.ohmshop.entrypoints=websecure"
      - "traefik.http.routers.ohmshop.tls=true"
      - "traefik.http.services.ohmshop.loadbalancer.server.port=8000"
      - "traefik.docker.network=8ohm-network"

volumes:
  traefik_certificates:
  static_assets:
  huggingface_cache:
  airflow_logs:
  postgres_data:

networks:
  8ohm-network:
    name: 8ohm-network
    driver: bridge
