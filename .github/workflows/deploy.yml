name: Deploy to AbsoluteHostingVPS

on:
  push:
    branches: [ main ]

jobs:
  # 1. Detect if the backend/Docker files actually changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Check for file changes
        uses: dorny/paths-filter@f3ceefdc7ef57bc2d8560787d4b6c33e44044cec
        id: filter
        with:
          filters: |
            backend:
              - 'Dockerfile.*'
              - 'requirements.txt'
              - 'control_plane/**'

  # 2. Build and Push (Only runs if 'detect-changes' found backend updates)
  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@22b48a429f10e1de233237b5c534c9c3d2e41597
        
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Push App
        uses: docker/build-push-action@1d0c110a5d679453d30b396aa86f6bb6ae377b76
        with:
          context: .
          file: Dockerfile.app
          push: true
          tags: ghcr.io/8ohm-technologies/coeus-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build and Push Worker
        uses: docker/build-push-action@1d0c110a5d679453d30b396aa86f6bb6ae377b76
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ghcr.io/8ohm-technologies/coeus-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Always deploy (Updates VPS compose and pulls new images if they were built)
  deploy:
    needs: [detect-changes, build-and-push]
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 

      - name: Prepare writable deploy paths
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /home/deploy-user/coeus/orchestration/airflow_dags
            mkdir -p /home/deploy-user/coeus/extraction_workers
            mkdir -p /home/deploy-user/coeus/data
            # CI cannot fix ownership when sudo requires a password.
            # Fail early with a clear message instead of failing later in SCP.
            if [ ! -w /home/deploy-user/coeus/orchestration/airflow_dags ] || [ ! -w /home/deploy-user/coeus/extraction_workers ] || [ ! -w /home/deploy-user/coeus/data ]; then
              echo "ERROR: deploy-user cannot write Airflow bind-mount dirs."
              echo "Run once on VPS as root:"
              echo "chown -R deploy-user:deploy-user /home/deploy-user/coeus/orchestration /home/deploy-user/coeus/extraction_workers /home/deploy-user/coeus/data"
              echo "chmod -R u+rwX /home/deploy-user/coeus/orchestration /home/deploy-user/coeus/extraction_workers /home/deploy-user/coeus/data"
              exit 1
            fi

      - name: Copy files to VPS
        uses: appleboy/scp-action@a6e43c3aaf4e8e6b0b15bf34e19d71118f6b1ca7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml,landing_page,orchestration/airflow_dags,extraction_workers" 
          target: "/home/deploy-user/coeus/"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/deploy-user/coeus/

            # Ensure bind-mounted DAG/worker paths are present and populated.
            test -f orchestration/airflow_dags/dynamic_factory.py
            test -n "$(ls -A extraction_workers)"

            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # Fail fast if scheduler container still does not see DAG files.
            docker exec coeus-airflow-scheduler test -f /opt/airflow/dags/dynamic_factory.py
            docker exec coeus-airflow-scheduler sh -lc 'test -n "$(ls -A /opt/airflow/extraction_workers)"'
            
            docker image prune -f