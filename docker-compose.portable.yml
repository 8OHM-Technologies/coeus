version: "3.8"

# ---------------------------------------------------------
# Portable / Instant-Spin-Up Compose File
#
# Use this to run the Coeus system on any host without a
# domain, SSL certificates, or Traefik. All services are
# exposed directly on host ports.
#
# Services & their ports:
#   Control Plane (Django API) → http://localhost:8001
#   Dagster Webserver          → http://localhost:3000
#   PostgreSQL                 → localhost:5432
#   Redis                      → localhost:6379
#
# NOTE: Uses network name '8ohm-network' to match the hardcoded
# value in dagster/dagster.yaml (DockerRunLauncher does not
# support env var interpolation for the network field).
#
# Usage:
#   docker compose -f docker-compose.portable.yml --env-file .env up -d
# ---------------------------------------------------------

services:

  # ---------------------------------------------------------
  # 1. PostgreSQL DB
  # ---------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    command: >
      postgres -c shared_buffers=256MB -c work_mem=16MB -c maintenance_work_mem=64MB -c max_connections=50 -c effective_cache_size=768MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    networks:
      - 8ohm-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # 2. Redis Cache
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - 8ohm-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # 3. Django Application Backend (Control Plane)
  # ---------------------------------------------------------
  control-plane:
    image: ghcr.io/8ohm-technologies/coeus-app:latest
    container_name: coeus-control-plane
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 4.1 Dagster Worker
  # ---------------------------------------------------------
  dagster-worker:
    image: ghcr.io/8ohm-technologies/coeus-dagster-worker:latest
    container_name: dagster-worker
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DAGSTER_CURRENT_IMAGE: "ghcr.io/8ohm-technologies/coeus-dagster-worker:latest"
    volumes:
      - ./data:/var/shared_scraping_data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [ "CMD", "dagster", "api", "grpc-health-check", "-h", "localhost", "-p", "4000" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 4.2 Dagster Webserver
  # ---------------------------------------------------------
  dagster-webserver:
    image: ghcr.io/8ohm-technologies/coeus-dagster-webserver:latest
    container_name: dagster-webserver
    depends_on:
      postgres:
        condition: service_healthy
      dagster-worker:
        condition: service_started
    restart: unless-stopped
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - workspace.yaml
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # 4.3 Dagster Daemon
  # ---------------------------------------------------------
  dagster-daemon:
    image: ghcr.io/8ohm-technologies/coeus-dagster-daemon:latest
    container_name: dagster-daemon
    depends_on:
      postgres:
        condition: service_healthy
      dagster-worker:
        condition: service_started
    restart: on-failure
    entrypoint:
      - dagster-daemon
      - run
    env_file:
      - .env
    environment:
      DAGSTER_CURRENT_IMAGE: "ghcr.io/8ohm-technologies/coeus-dagster-daemon:latest"
      DAGSTER_SCRAPER_IMAGE: "ghcr.io/8ohm-technologies/coeus-scraper:latest"
      DAGSTER_EXTRACTOR_IMAGE: "ghcr.io/8ohm-technologies/coeus-extractor:latest"
    volumes:
      - ./data:/var/shared_scraping_data
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - 8ohm-network

volumes:
  postgres_data:

networks:
  8ohm-network:
    name: 8ohm-network
    driver: bridge
