name: Deploy to AbsoluteHostingVPS

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push App & Worker
        run: |
          # 1. Build and push the App image
          docker build -f Dockerfile.app -t ghcr.io/8ohm-technologies/coeus-app:latest .
          docker push ghcr.io/8ohm-technologies/coeus-app:latest
          
          # 2. Build and push the Worker image
          docker build -f Dockerfile.worker -t ghcr.io/8ohm-technologies/coeus-worker:latest .
          docker push ghcr.io/8ohm-technologies/coeus-worker:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Pull the image and restart
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose pull
            docker compose up -d