services:
  # ---------------------------------------------------------
  # 0. Database Proxy (Secure Tunnel to Cloud SQL)
  # ---------------------------------------------------------
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
    container_name: coeus-cloud-sql-proxy
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${INSTANCE_CONNECTION_NAME}"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /config/application_default_credentials.json
    volumes:
      - /home/deploy-user/coeus/gcloud-config:/config:ro
    networks:
      - 8ohm-network
    restart: always

  # ---------------------------------------------------------
  # 1. Reverse Proxy (Routing & VPS Edge SSL)
  # ---------------------------------------------------------
  traefik:
    image: traefik:latest
    container_name: coeus-traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/deploy-user/coeus/traefik-config:/etc/traefik/dynamic:ro
    networks:
      - 8ohm-network
    restart: always

  # ---------------------------------------------------------
  # 2. Control Plane / Orchestration UI
  # ---------------------------------------------------------
  control_plane:
    image: ghcr.io/8ohm-technologies/coeus-app:latest
    container_name: coeus-control-plane
    depends_on:
      - cloud-sql-proxy
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-plane.rule=Host(`control-plane.8ohm.co.za`)"
      - "traefik.http.routers.control-plane.entrypoints=websecure"
      - "traefik.http.routers.control-plane.tls=true"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8001"
      - "traefik.docker.network=8ohm-network"
    command: >
      bash -c "python control_plane/manage.py migrate && 
               python control_plane/manage.py runserver 0.0.0.0:8001"
    restart: always

  # ---------------------------------------------------------
  # 3. Ingestion & Extraction Worker (Playwright + OpenAI)
  # ---------------------------------------------------------
  pipeline_worker:
    image: ghcr.io/8ohm-technologies/coeus-worker:latest
    container_name: coeus-pipeline-worker
    depends_on:
      - cloud-sql-proxy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: cloud-sql-proxy
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - /home/deploy-user/coeus/data:/app/data
      - huggingface_cache:/app/huggingface_cache
    networks:
      - 8ohm-network
    command: tail -f /dev/null
    restart: always

  # ---------------------------------------------------------
  # 4. Orchestration (Apache Airflow Standalone)
  # ---------------------------------------------------------
  airflow:
    image: apache/airflow:2.9.1-python3.11
    container_name: coeus-airflow
    depends_on:
      - cloud-sql-proxy
    user: "50000:0"
    group_add:
      - "988"
    entrypoint: >
      /bin/bash -c "airflow standalone"
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: False
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_SQL_ALCHEMY_CONN}
      HOST_DATA_PATH: /home/deploy-user/coeus/data
      COEUS_API_URL: ${COEUS_API_URL}

      AIRFLOW__WEBSERVER__WEB_SERVER_HOST: 0.0.0.0
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: 8080
      AIRFLOW__WEBSERVER__BASE_URL: https://airflow.8ohm.co.za
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airflow.rule=Host(`airflow.8ohm.co.za`)"
      - "traefik.http.routers.airflow.entrypoints=websecure"
      - "traefik.http.routers.airflow.tls=true"
      - "traefik.http.services.airflow.loadbalancer.server.port=8080"
      - "traefik.docker.network=8ohm-network"
    volumes:
      - /home/deploy-user/coeus/orchestration/airflow_dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - 8ohm-network
    restart: always

  # ---------------------------------------------------------
  # 5. Marketing / Main Landing Page (Nginx)
  # ---------------------------------------------------------
  landing_page:
    image: nginx:alpine
    container_name: coeus-landing-page
    restart: always
    volumes:
      - /home/deploy-user/coeus/landing-page:/usr/share/nginx/html:ro
    networks:
      - 8ohm-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing-page.rule=Host(`8ohm.co.za`) || Host(`www.8ohm.co.za`)"
      - "traefik.http.routers.landing-page.entrypoints=websecure"
      - "traefik.http.routers.landing-page.tls=true"
      - "traefik.http.services.landing-page.loadbalancer.server.port=80"
      - "traefik.docker.network=8ohm-network"

volumes:
  huggingface_cache:

networks:
  8ohm-network:
    name: 8ohm-network
    driver: bridge
